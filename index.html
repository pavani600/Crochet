<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loop & Love – Handmade Crochet Studio</title>
    <meta name="description" content="A complete, modern, responsive crochet e-commerce website." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Official n8n Chat Widget Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
    <style>
      :root {
        --chat--color-primary: #8B4513;
        --chat--color-primary-shade-50: #783b10;
        --chat--color-primary-shade-100: #622f0c;
        --chat--color-secondary: #FFFDD0;
        --chat--border-radius: 16px;
      }
      .chat-toggle {
        box-shadow: 0 10px 25px -5px rgba(139, 69, 19, 0.4) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Official n8n Chat Initialization -->
    <script type="module">
      import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

      try {
        createChat({
          webhookUrl: window.location.origin + '/api/chatbot',
          initialMessages: [
            'Hello! 🧶 Welcome to Loop & Love – Handmade Crochet Studio. How can I help you today?'
          ],
          i18n: {
            en: {
              title: 'Loop & Love Assistant',
              subtitle: 'Handmade Crochet Studio AI',
              footer: '',
              getStarted: 'New Conversation',
              inputPlaceholder: 'Type your message...',
            },
          },
        });
      } catch (err) {
        console.warn('n8n chat initialization notice:', err);
      }
    </script>
  </body>
</html>
